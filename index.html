<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>黑洞碰撞模拟 | Black Hole Collision Simulation</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            touch-action: none;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            text-align: center;
            z-index: 100;
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 20px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>正在加载黑洞模拟器...</div>
        <div style="font-size:14px;opacity:0.6;margin-top:8px;">Loading Black Hole Simulator...</div>
    </div>
    <div id="canvas-container"></div>
    <script>
        (function() {
            const origError = console.error;
            const origWarn = console.warn;
            const ctrlFlowMsg = 'Using exceptions for control flow';
            function isCtrlFlow(args) {
                for (let i = 0; i < args.length; i++) {
                    const a = args[i];
                    if (typeof a === 'string' && a.includes(ctrlFlowMsg)) return true;
                    if (a instanceof Error && a.message && a.message.includes(ctrlFlowMsg)) return true;
                }
                return false;
            }
            console.error = function(...args) {
                if (isCtrlFlow(args)) return;
                origError.apply(console, args);
            };
            console.warn = function(...args) {
                if (isCtrlFlow(args)) return;
                origWarn.apply(console, args);
            };
            window.addEventListener('error', function(e) {
                if (e.message && e.message.includes(ctrlFlowMsg)) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            }, true);
            window.addEventListener('unhandledrejection', function(e) {
                if (e.reason) {
                    const msg = typeof e.reason === 'string' ? e.reason : (e.reason.message || '');
                    if (msg.includes(ctrlFlowMsg)) {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    }
                }
            });
        })();
    </script>
    <script type="module">
        import init, { touch_rotate, touch_zoom } from './blackhole_sim.js';

        let panelVisible = true;
        let panelWidth = 260;

        function updatePanelWidth() {
            const screenWidth = window.innerWidth;
            if (screenWidth < 768) {
                panelWidth = screenWidth * 0.8;
            } else {
                panelWidth = 260;
            }
        }
        updatePanelWidth();
        window.addEventListener('resize', updatePanelWidth);

        function isInUiArea(clientX, clientY) {
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;
            if (panelVisible && clientX >= screenWidth - panelWidth) {
                return true;
            }
            if (clientY < 100 && clientX < 100) {
                return true;
            }
            if (!panelVisible && clientY < 50 && clientX > screenWidth - 120) {
                return true;
            }
            if (clientY > screenHeight - 40) {
                return true;
            }
            return false;
        }

        window.__setPanelVisible = function(visible) {
            panelVisible = visible;
        };

        async function run() {
            try {
                await init();
                document.getElementById('loading').style.display = 'none';

                const canvas = document.querySelector('canvas');
                if (!canvas) return;

                let activePointers = new Map();
                let lastPinchDist = null;
                let cameraGestureActive = false;

                function onPointerDown(e) {
                    if (e.pointerType !== 'touch') return;
                    if (e.target !== canvas) return;
                    if (isInUiArea(e.clientX, e.clientY)) return;

                    activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                    cameraGestureActive = true;

                    if (activePointers.size === 2) {
                        const pts = Array.from(activePointers.values());
                        lastPinchDist = Math.sqrt((pts[0].x - pts[1].x) ** 2 + (pts[0].y - pts[1].y) ** 2);
                    }

                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                }

                function onPointerMove(e) {
                    if (e.pointerType !== 'touch') return;
                    if (!activePointers.has(e.pointerId)) return;

                    const entry = activePointers.get(e.pointerId);
                    const oldX = entry.x;
                    const oldY = entry.y;
                    entry.x = e.clientX;
                    entry.y = e.clientY;

                    if (activePointers.size === 1) {
                        const dx = e.clientX - oldX;
                        const dy = e.clientY - oldY;
                        touch_rotate(dx, dy);
                    } else if (activePointers.size >= 2) {
                        const pts = Array.from(activePointers.values());
                        const currentDist = Math.sqrt((pts[0].x - pts[1].x) ** 2 + (pts[0].y - pts[1].y) ** 2);
                        if (lastPinchDist !== null) {
                            const zoomAmount = (lastPinchDist - currentDist) * 0.03;
                            touch_zoom(zoomAmount);
                        }
                        lastPinchDist = currentDist;
                    }

                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                }

                function onPointerEnd(e) {
                    if (e.pointerType !== 'touch') return;
                    if (!activePointers.has(e.pointerId)) return;

                    activePointers.delete(e.pointerId);
                    if (activePointers.size < 2) {
                        lastPinchDist = null;
                    }
                    if (activePointers.size === 0) {
                        cameraGestureActive = false;
                    }

                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                }

                document.addEventListener('pointerdown', onPointerDown, { passive: false, capture: true });
                document.addEventListener('pointermove', onPointerMove, { passive: false, capture: true });
                document.addEventListener('pointerup', onPointerEnd, { passive: false, capture: true });
                document.addEventListener('pointercancel', onPointerEnd, { passive: false, capture: true });
                document.addEventListener('pointerleave', onPointerEnd, { passive: false, capture: true });
            } catch (e) {
                if (e.message && e.message.includes('Using exceptions for control flow')) {
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                document.getElementById('loading').innerHTML =
                    '<div style="color:#ff6b6b;">加载失败 / Load failed</div>' +
                    '<div style="font-size:14px;opacity:0.8;margin-top:8px;">' + e.message + '</div>';
                console.error(e);
            }
        }
        run();
    </script>
</body>
</html>
