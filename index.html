<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑洞碰撞模拟 | Black Hole Collision Simulation</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            text-align: center;
            z-index: 100;
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 20px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>正在加载黑洞模拟器...</div>
        <div style="font-size:14px;opacity:0.6;margin-top:8px;">Loading Black Hole Simulator...</div>
    </div>
    <div id="canvas-container"></div>
    <script type="module">
        import init from './blackhole_sim.js';
        async function run() {
            try {
                await init();
                document.getElementById('loading').style.display = 'none';
            } catch (e) {
                document.getElementById('loading').innerHTML =
                    '<div style="color:#ff6b6b;">加载失败 / Load failed</div>' +
                    '<div style="font-size:14px;opacity:0.8;margin-top:8px;">' + e.message + '</div>';
                console.error(e);
            }
        }
        run();
    </script>
</body>
</html>
