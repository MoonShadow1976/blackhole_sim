name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: blackhole_sim.exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: blackhole_sim
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: blackhole_sim
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: blackhole_sim
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libvulkan1 \
            mesa-vulkan-drivers

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release directory
        shell: bash
        run: |
          mkdir -p release-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} release-${{ matrix.target }}/
          cp README.md release-${{ matrix.target }}/
          cp README_CN.md release-${{ matrix.target }}/

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        run: Compress-Archive -Path release-${{ matrix.target }}/* -DestinationPath blackhole_sim-${{ matrix.target }}.zip

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: tar -czf blackhole_sim-${{ matrix.target }}.tar.gz -C release-${{ matrix.target }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackhole_sim-${{ matrix.target }}
          path: blackhole_sim-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create source archive
        run: |
          mkdir -p source
          git archive --format=tar.gz --prefix=blackhole_sim-source/ HEAD > blackhole_sim-source.tar.gz
          git archive --format=zip --prefix=blackhole_sim-source/ HEAD > blackhole_sim-source.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            blackhole_sim-*/blackhole_sim-*
            blackhole_sim-source.*
